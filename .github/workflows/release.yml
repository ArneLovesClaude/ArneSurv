# Erstellt automatisch ein GitHub-Release, sobald ein Tag wie "v1.0.0" hochgeladen wird.
# Die Version im Mod wird dabei aus dem Tag übernommen.

name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: set version from tag
        run: sed -i "s/^version=.*/version=${GITHUB_REF_NAME#v}/" gradle.properties
      - name: build
        run: ./gradlew build
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "build/libs/ArneSurv-${VERSION}.jar" \
            --title "ArneSurv ${VERSION}" \
            --notes "Für Minecraft 26.3 mit Fabric Loader und Fabric API. Die .jar in den mods-Ordner legen." \
            --generate-notes
